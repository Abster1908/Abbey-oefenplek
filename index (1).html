<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abbey's Doorstroom Oefenplek</title><style>body{font-family:system-ui;background:#fff8f1;color:#342b35;margin:0}header{background:#6d477d;color:white;padding:22px;text-align:center}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}button{background:#6d477d;color:white;border:0;border-radius:10px;padding:12px;margin:5px;cursor:pointer}input,textarea{font:inherit;padding:10px;border:1px solid #aaa;border-radius:8px;max-width:95%}.good{color:green}.bad{color:#b22}small{color:#666}</style></head><body><header><h1>🌟 Abbey's Doorstroom Oefenplek</h1><p>Elke dag een beetje sterker!</p></header><main><div class="card"><h2>Kies je missie</h2><div id="nav"></div></div><div class="card" id="work"></div><div class="card"><h2>Mijn voortgang op dit apparaat</h2><div id="progress"></div><button onclick="exportProgress()">Download mijn resultaten</button><p><small>Resultaten worden alleen in deze browser opgeslagen. Voor ouderinzage op een ander apparaat is later een beveiligde koppeling nodig. Vul geen volledige naam of andere persoonsgegevens in.</small></p></div></main><script>
const sets={
'Rekenen':[
['Een jas kost €80. Je krijgt 25% korting. Wat betaal je in euro?','60','25% van 80 is 20; 80 − 20 = 60.'],
['Een recept voor 4 personen gebruikt 300 gram rijst. Hoeveel gram voor 6 personen?','450','300 ÷ 4 × 6 = 450.'],
['Een fietsroute is 18 km. Je fietst 2/3. Hoeveel km heb je gefietst?','12','18 ÷ 3 × 2 = 12.'],
['Een winkel verkoopt 5 schriften voor €12,50. Wat kosten 8 schriften?','20','12,50 ÷ 5 × 8 = 20.'],
['Van de 240 leerlingen gaat 15% met de bus. Hoeveel leerlingen zijn dat?','36','0,15 × 240 = 36.'],
['Een trein vertrekt om 14:35 en rijdt 1 uur en 48 minuten. Hoe laat komt hij aan?','16:23','14:35 + 1:48 = 16:23.'],
['Een rechthoek is 12 cm lang en 7 cm breed. Wat is de oppervlakte in cm²?','84','12 × 7 = 84.'],
['Je spaart €18 per week. Hoeveel weken heb je nodig voor €126?','7','126 ÷ 18 = 7.']],
'Spelling':[
['Vul het juiste woord in: Gisteren ___ ik naar school. (fietsen)','fietste','Verleden tijd: ik fietste.'],
['Vul in: Zij ___ morgen twaalf. (worden)','wordt','Zij wordt: stam + t.'],
['Schrijf het meervoud van museum.','musea','Museum → musea.'],
['Vul in: De kinderen hebben hard ___. (werken)','gewerkt','Voltooid deelwoord: gewerkt.']],
'Begrijpend lezen':[
['Lees: “Mila vertrok vroeg, omdat ze voor school nog naar de bibliotheek wilde.” Waarom vertrok Mila vroeg?','om naar de bibliotheek te gaan','De reden staat na “omdat”.'],
['Lees: “Het regende, toch ging Sam zonder paraplu naar buiten.” Wat betekent “toch” hier?','ondanks de regen','Toch geeft een tegenstelling aan.']],
'Aardrijkskunde':[
['Wat is de hoofdstad van Japan?','tokio','Tokio is de hoofdstad van Japan.'],
['Wat is de hoofdstad van China?','beijing','Beijing (Peking) is de hoofdstad van China.'],
['Welk land ligt ten zuiden van China en ten noorden van Thailand?','laos','Laos ligt tussen China en Thailand.']]
};
let topic='Rekenen',idx=0;const norm=s=>s.toLowerCase().trim().replace(/[€\s]/g,'').replace(',','.');const key='abbey_oefenplek_progress_v1';function data(){try{return JSON.parse(localStorage.getItem(key))||[]}catch{return []}}function render(){document.getElementById('nav').innerHTML=Object.keys(sets).map(t=>`<button onclick="choose('${t}')">${t}</button>`).join('');const q=sets[topic][idx];document.getElementById('work').innerHTML=`<h2>${topic} · opdracht ${idx+1} van ${sets[topic].length}</h2><p>${q[0]}</p>${topic==='Rekenen'?'<label>Mijn tussenstappen<br><textarea id="steps" rows="3" placeholder="Schrijf hoe je rekent"></textarea></label><br>':''}<label>Mijn antwoord<br><input id="answer" autocomplete="off"></label><br><button onclick="check()">Controleer</button><button onclick="next()">Volgende</button><p id="feedback" aria-live="polite"></p>`;showProgress()}function choose(t){topic=t;idx=0;render()}function check(){let q=sets[topic][idx],a=document.getElementById('answer').value,ok=norm(a)===norm(q[1]);let steps=document.getElementById('steps')?.value||'';let d=data();d.push({datum:new Date().toISOString(),onderwerp:topic,vraag:idx+1,goed:ok,antwoord:a,tussenstappen:steps});localStorage.setItem(key,JSON.stringify(d));document.getElementById('feedback').innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'Goed gedaan!':'Nog niet goed.'}</strong><br>Uitleg: ${q[2]}${steps?'<br><small>Je tussenstappen zijn bewaard, maar worden nog niet automatisch inhoudelijk beoordeeld.</small>':''}`;showProgress()}function next(){idx=(idx+1)%sets[topic].length;render()}function showProgress(){let d=data(),good=d.filter(x=>x.goed).length;document.getElementById('progress').textContent=`${d.length} antwoorden gecontroleerd, ${good} goed.`}function exportProgress(){let blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='abbey-resultaten.json';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
